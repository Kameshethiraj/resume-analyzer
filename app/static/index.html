<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f6f1">
  <title>Resume Studio</title>
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="Resume Studio home"><span class="brand-mark">R</span><span>Resume Studio</span></a>
    <div id="account" class="account" hidden>
      <span id="account-email"></span>
      <button id="logout-button" class="button button-quiet" type="button">Log out</button>
    </div>
  </header>
  <main id="app" class="main" aria-live="polite">
    <section class="loading" aria-label="Loading">Loading your workspace...</section>
  </main>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
